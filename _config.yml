# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
timezone: Asia/Kolkata
future: false

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: code

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .github
  - .DS_Store
